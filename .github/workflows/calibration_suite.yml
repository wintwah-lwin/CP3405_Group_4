name: Run Calibration & Accuracy Suite

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week Number to calibrate (e.g., 9)'
        required: true
        default: '9'
        type: string

permissions:
  contents: write

jobs:
  run-calibration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Run Calibration Suite
        run: |
          python TradeKyaMal/scripts/run_calibration_suite.py --week ${{ inputs.week }} --repo .

      - name: Run Past Accuracy Report
        run: |
          python TradeKyaMal/scripts/build_past_accuracy_report.py --week ${{ inputs.week }} --repo .

      - name: Commit and push generated evidence reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: generate calibration reports for Week ${{ inputs.week }}"
          file_pattern: "evidence/*"
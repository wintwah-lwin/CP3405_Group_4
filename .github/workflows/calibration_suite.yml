name: Run Calibration & Accuracy Suite

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week Number to calibrate (e.g., 9)'
        required: true
        default: '9'
        type: string

permissions:
  contents: write

jobs:
  run-calibration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r TradeKyaMal/scripts/requirements.txt

      - name: Run Calibration Suite
        run: |
          python TradeKyaMal/scripts/run_calibration_suite.py --week ${{ inputs.week }} --repo .

      - name: Run Past Accuracy Report
        run: |
          python TradeKyaMal/scripts/build_past_accuracy_report.py --week ${{ inputs.week }} --repo .

      - name: Auto-commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add evidence/

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "auto: generate calibration reports for Week ${{ inputs.week }}"

          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

name: Auto Prediction

# Single pipeline runner — evidence commits to this repo only.
on:
  schedule:
    - cron: '0 20 * * 5' # Saturday 4:00 AM SGT
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      SCRIPTS: ${{ github.workspace }}/TradeKyaMal/scripts
      PYTHONPATH: ${{ github.workspace }}/TradeKyaMal/scripts
      MPLBACKEND: Agg
      TZ: Asia/Singapore

    steps:
      - name: Checkout group repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Sync with remote
        run: |
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: TradeKyaMal/scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r TradeKyaMal/scripts/requirements.txt
          pip install openai google-generativeai yfinance

      - name: Compute project week
        id: week
        shell: bash
        run: |
          START_DATE="2026-05-25"
          CURRENT_DATE=$(date +%F)

          START_SECS=$(date -d "$START_DATE" +%s)
          CURRENT_SECS=$(date -d "$CURRENT_DATE" +%s)
          DAYS_PASSED=$(( (CURRENT_SECS - START_SECS) / 86400 ))
          PROJECT_WEEK=$(( (DAYS_PASSED - 1) / 7 + 1 ))

          if [ "$PROJECT_WEEK" -lt 1 ]; then
            echo "Invalid project week: $PROJECT_WEEK"
            exit 1
          fi

          echo "week=$PROJECT_WEEK" >> "$GITHUB_OUTPUT"
          echo "Running Project Week: $PROJECT_WEEK"

      - name: Run automated fetch (R6)
        run: |
          python "$SCRIPTS/run_weekly_fetch.py" \
            --week "${{ steps.week.outputs.week }}" \
            --repo "${{ github.workspace }}" \
            --no-push

      - name: Run Almanac Agent (R3)
        run: |
          python "$SCRIPTS/run_almanac_agent.py" \
            --week "${{ steps.week.outputs.week }}" \
            --repo "${{ github.workspace }}" \
            --no-push

      - name: Run Macro Agent (R4)
        run: |
          python "$SCRIPTS/run_macro_agent.py" \
            --week "${{ steps.week.outputs.week }}" \
            --repo "${{ github.workspace }}" \
            --no-push

      - name: Run Technical Agent (R5)
        run: |
          python "$SCRIPTS/run_technical_agent.py" \
            --week "${{ steps.week.outputs.week }}" \
            --repo "${{ github.workspace }}" \
            --no-push

      - name: Run LLM synthesis (R8)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python "$SCRIPTS/run_llm_integration.py" \
            --week "${{ steps.week.outputs.week }}" \
            --repo "${{ github.workspace }}" \
            --no-push

      - name: Verify LLM API calls succeeded
        shell: bash
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          week = os.environ["WEEK"]
          log = f"evidence/Week {week}/llm_responses_2026-W{week}.json"

          with open(log, encoding="utf-8") as f:
              data = json.load(f)

          failed = [item for item in data if not item.get("ok")]
          if failed:
              for item in failed:
                  print(f"FAILED: {item.get('model')} -> {item.get('text')}")
              sys.exit(1)

          print("OpenAI and Gemini both succeeded.")
          PY

      - name: Generate final prediction
        run: |
          python "$SCRIPTS/run_final_prediction.py" \
            --week "${{ steps.week.outputs.week }}" \
            --repo "${{ github.workspace }}" \
            --no-push

      - name: Run Calibration Suite
        run: |
          python "$SCRIPTS/run_calibration_suite.py" \
            --week "${{ steps.week.outputs.week }}" \
            --repo "${{ github.workspace }}"

      - name: Run Past Accuracy Report
        run: |
          python "$SCRIPTS/build_past_accuracy_report.py" \
            --week "${{ steps.week.outputs.week }}" \
            --repo "${{ github.workspace }}"

      - name: Verify generated files
        shell: bash
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          WEEK_DIR="evidence/Week $WEEK"

          test -f "$WEEK_DIR/almanac_agent_2026-W$WEEK.md"
          test -f "$WEEK_DIR/macro_agent_2026-W$WEEK.md"
          test -f "$WEEK_DIR/technical_agent_2026-W$WEEK.md"
          test -f "$WEEK_DIR/llm_integration_2026-W$WEEK.md"
          test -f "$WEEK_DIR/final_prediction_2026-W$WEEK.md"
          test -f "$WEEK_DIR/calibration_report_2026-W$WEEK.md"
          test -f "$WEEK_DIR/past_accuracy_log.md"

          echo "All required Week $WEEK reports were generated."

      - name: Auto-commit and push
        shell: bash
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add evidence/

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-commit: Pipeline execution (Week $WEEK)"
          BRANCH="${{ github.ref_name }}"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."
            if git push origin "HEAD:$BRANCH"; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected — merging remote, keeping this run's evidence files."
            git fetch origin "$BRANCH"

            if git merge "origin/$BRANCH" -X ours --no-edit; then
              continue
            fi

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                evidence/*|incoming/*)
                  git checkout --ours -- "$file" 2>/dev/null || true
                  git add -- "$file" 2>/dev/null || true
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U 2>/dev/null || true)

            git add evidence/ incoming/ 2>/dev/null || true
            git commit --no-edit || GIT_EDITOR=true git merge --continue
          done

          echo "Failed to push after 3 attempts."
          exit 1
